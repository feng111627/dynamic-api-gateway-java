# Local demo profile: gateway + two in-process simulated backends.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
server.port=18080

gateway.backend-simulator.enabled=true
gateway.backend-simulator.base-port=18081
gateway.backend-simulator.instances=2

# fast health detection for easy manual failover demo
gateway.health-probe-interval-ms=1000
gateway.healthy-threshold=1
gateway.unhealthy-threshold=1

# sticky session: 60s lifetime, reattach to recovered original after 1s backoff
gateway.sticky-ttl-ms=60000
gateway.sticky-reattach-backoff-ms=1000

# demo routing limits: orders 5 req/10s per caller (20 route-wide); products 100 route-wide
gateway.demo-route-limit=20
gateway.demo-caller-limit=5
gateway.demo-window-seconds=10
