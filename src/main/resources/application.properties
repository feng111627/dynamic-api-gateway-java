server.port=8080

# 会话粘性 TTL（毫秒）
gateway.session.ttl-millis=300000

# 默认后端权重与单实例并发上限（0 表示不限并发）
gateway.backend1.port=18081
gateway.backend2.port=18082
gateway.backend1.weight=1
gateway.backend2.weight=1
gateway.backend1.max-concurrency=0
gateway.backend2.max-concurrency=0

# 实例自动恢复：探活间隔、恢复后预热时长、预热期承接新会话的比例分母（1/N）
gateway.recovery.probe-interval-millis=1000
gateway.recovery.warmup-millis=5000
gateway.recovery.share-divisor=4

# 实例并发打满后排队等待名额的超时（毫秒，<=0 表示不排队立即尝试其他实例）
gateway.capacity.acquire-timeout-millis=200
