# Default to an ephemeral port; demo runs set a fixed port explicitly.
server.port=${PORT:0}

# --- Gateway core settings ---
gateway.caller-header=X-Caller-Id
gateway.health-probe-interval-ms=2000
gateway.healthy-threshold=1
gateway.unhealthy-threshold=1
gateway.sticky-ttl-ms=60000
gateway.sticky-reattach-backoff-ms=1000
gateway.forward-timeout-ms=5000
gateway.retry-get-on-5xx=true

# --- Local in-process backend simulator ---
gateway.backend-simulator.enabled=false
gateway.backend-simulator.base-port=18081
gateway.backend-simulator.instances=2
